server:
  port: 2026
spring:
  application:
    name: monitoringapi
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

management:
  server:
    port: 8089
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health,metrics,prometheus'
  endpoint:
    health:
      enabled: true
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true

logging:
  level:
    org:
      springframework:
        cache: DEBUG




